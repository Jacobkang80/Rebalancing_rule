<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>석우민호 리밸런싱 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto space-y-5">
        <header class="border-b border-slate-700 pb-3">
            <h1 class="text-xl font-bold text-white">석우민호 포트폴리오 리밸런싱</h1>
            <p class="text-slate-400 text-xs mt-1">국내주식 · 해외주식 · 금 · 달러 비중 진단</p>
        </header>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
            <div id="statusBadge" class="text-xl font-bold"></div>
            <p id="statusDesc" class="text-xs text-slate-400"></p>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 h-48 flex justify-center items-center">
            <canvas id="portfolioChart"></canvas>
        </div>

        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3 text-xs">
            <div>
                <label class="text-slate-400 block mb-1">총 자산 (원)</label>
                <input type="number" id="totalAmount" value="100000000" oninput="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-right font-mono text-indigo-300">
            </div>
            <div>
                <label class="text-slate-400 block mb-1">리밸런싱 기준 (임계치)</label>
                <select id="bandLimit" onchange="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-slate-200">
                    <option value="3">±3%p 이탈 시</option>
                    <option value="5" selected>±5%p 이탈 시 (권장)</option>
                    <option value="10">±10%p 이탈 시</option>
                </select>
            </div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden text-xs">
            <table class="w-full text-left">
                <thead class="bg-slate-900 text-slate-400 border-b border-slate-700">
                    <tr>
                        <th class="p-3">자산</th>
                        <th class="p-3 text-center">목표%</th>
                        <th class="p-3 text-center">현재%</th>
                        <th class="p-3 text-right">조정금액</th>
                    </tr>
                </thead>
                <tbody id="assetRows" class="divide-y divide-slate-700"></tbody>
            </table>
        </div>
    </div>

    <script>
        const assets = [
            { name: '국내주식', target: 30, current: 40, color: '#3B82F6' },
            { name: '해외주식', target: 40, current: 50, color: '#10B981' },
            { name: '금 (Gold)', target: 15, current: 5, color: '#F59E0B' },
            { name: '달러/현금', target: 15, current: 5, color: '#6366F1' }
        ];

        let chart = null;

        function initChart() {
            const ctx = document.getElementById('portfolioChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: assets.map(a => a.name),
                    datasets: [{ data: assets.map(a => a.current), backgroundColor: assets.map(a => a.color), borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#94A3B8', font: { size: 9 } } } }, cutout: '65%' }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('assetRows');
            tbody.innerHTML = '';
            assets.forEach((asset, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-semibold">${asset.name}</td>
                    <td class="p-3 text-center"><input type="number" id="t_${idx}" value="${asset.target}" oninput="updateVal()" class="w-10 bg-slate-900 border border-slate-700 rounded text-center text-indigo-300"></td>
                    <td class="p-3 text-center"><input type="number" id="c_${idx}" value="${asset.current}" oninput="updateVal()" class="w-10 bg-slate-900 border border-slate-700 rounded text-center"></td>
                    <td class="p-3 text-right font-mono" id="amt_${idx}">0</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateVal() {
            assets.forEach((a, i) => {
                a.target = parseFloat(document.getElementById(`t_${i}`).value) || 0;
                a.current = parseFloat(document.getElementById(`c_${i}`).value) || 0;
            });
            calculate();
        }

        function calculate() {
            const total = parseFloat(document.getElementById('totalAmount').value) || 0;
            const band = parseFloat(document.getElementById('bandLimit').value) || 0;
            let maxDev = 0, sumC = 0;

            assets.forEach((a, i) => {
                sumC += a.current;
                const dev = Math.abs(a.current - a.target);
                if (dev > maxDev) maxDev = dev;

                const adjRatio = a.target - a.current;
                const amt = (total * adjRatio) / 100;
                const amtElem = document.getElementById(`amt_${i}`);

                if (Math.abs(adjRatio) < 0.1) {
                    amtElem.textContent = "유지";
                    amtElem.className = "p-3 text-right text-slate-500";
                } else if (adjRatio > 0) {
                    amtElem.textContent = `+${Math.round(amt/10000)}만`;
                    amtElem.className = "p-3 text-right text-emerald-400 font-bold";
                } else {
                    amtElem.textContent = `${Math.round(amt/10000)}만`;
                    amtElem.className = "p-3 text-right text-rose-400 font-bold";
                }
            });

            const badge = document.getElementById('statusBadge');
            const desc = document.getElementById('statusDesc');

            if (maxDev >= band) {
                badge.innerHTML = `<span class="text-rose-400">🔴 리밸런싱 필요</span>`;
                desc.textContent = `비중 괴리율이 ±${band}%p를 넘었습니다. 매매를 권장합니다.`;
            } else {
                badge.innerHTML = `<span class="text-emerald-400">🟢 관망 (안정)</span>`;
                desc.textContent = `모든 자산이 설정 범위 내에서 유지되고 있습니다.`;
            }

            if (chart) {
                chart.data.datasets[0].data = assets.map(a => a.current);
                chart.update();
            }
        }

        renderTable();
        initChart();
        calculate();
    </script>
</body>
</html>
